<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">

    <div class="container py-5" style="max-width: 700px;">
        <div class="card shadow-sm border-0">
            <!-- Card Header -->
            <div class="card-header bg-primary text-white fw-bold py-3">
                <h4 class="mb-0 fs-5 text-center">Form Input Data Sekolah</h4>
            </div>

            <!-- Card Body / Form -->
            <div class="card-body p-4">
                <form action="input.php" method="POST">
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">NPSN</label>
                            <input type="text" name="npsn" class="form-control" placeholder="Masukkan NPSN" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Status</label>
                            <select name="status" class="form-select" required>
                                <option value="" selected disabled>-- Pilih Status --</option>
                                <option value="Negeri">Negeri</option>
                                <option value="Swasta">Swasta</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Sekolah</label>
                        <input type="text" name="nama" class="form-control" placeholder="Contoh: SMAN 2 Surabaya" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Alamat</label>
                        <textarea name="alamat" class="form-control" rows="2" placeholder="Jl. Raya Darmo No. 49" required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Desa / Kelurahan</label>
                            <input type="text" name="desa" class="form-control" placeholder="Keputran">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Kecamatan</label>
                            <input type="text" name="kecamatan" class="form-control" placeholder="Tegalsari" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Kabupaten / Kota</label>
                        <input type="text" name="kabupaten" class="form-control" value="Kota Surabaya" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Latitude</label>
                            <input type="text" name="latitude" class="form-control" placeholder="-7.203701" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Longitude</label>
                            <input type="text" name="longitude" class="form-control" placeholder="112.740594" required>
                        </div>
                    </div>
